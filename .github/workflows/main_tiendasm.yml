# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - tmapi2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # El backend no esta en la raiz del repositorio, esta en PROTOTIPO/api.
      # Sin working-directory, npm install no encuentra el package.json y el
      # flujo entero falla.
      # Aqui no se corren las pruebas: vitest necesita la base de datos de
      # Supabase y las variables de entorno, que no existen en este entorno.
      # Las pruebas se ejecutan aparte, contra la base de datos de pruebas.
      - name: instalar dependencias y compilar
        working-directory: PROTOTIPO/api
        run: |
          npm install
          npm run build --if-present

      # El artefacto tiene que ser SOLO la carpeta de la API. Si se sube el
      # repositorio entero, Azure recibe un paquete sin package.json en la
      # raiz y el despliegue falla.
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: PROTOTIPO/api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CF7362F6C07D4CB3BDCA4137DADFB339 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EA94E0C1FBEF49339D5F8E8BAE33D2C8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7C04BE7284BF47809B3D2560C39BF251 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tmapi2'
          slot-name: 'Production'
          package: .
          