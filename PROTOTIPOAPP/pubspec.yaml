name: tiendasmontano_app
description: "Plataforma Móvil Inteligente de Comercio Electrónico con Vestidor Virtual RA y Panel Administrativo - Tiendas Montaño (Sistemas 2)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.12.0
  google_mlkit_commons: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/productos/
