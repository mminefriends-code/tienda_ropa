services:
  # 1. API Backend (NestJS + TypeORM + PostgreSQL)
  - type: web
    name: tiendas-montano-api
    runtime: node
    rootDir: PROTOTIPO/api
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: tiendas-montano-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://tiendas-montano-web.onrender.com,http://localhost:5173"

  # 2. Frontend Web (Vite + React + Vestidor Virtual RA)
  - type: web
    name: tiendas-montano-web
    runtime: static
    rootDir: PROTOTIPO/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://tiendas-montano-api.onrender.com/api/v1

databases:
  # 3. Base de Datos PostgreSQL Administrada en la Nube
  - name: tiendas-montano-db
    databaseName: tiendasmontano
    user: montano_admin
    plan: free
    region: oregon
